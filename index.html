<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес Калькулятор</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .form-group {
            width: 100%;
            max-width: 300px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #fafafa);
            color: var(--tg-theme-text-color, #000000);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>📊 Расчет калорий</h2>
    
    <div class="form-group">
        <label>Пол:</label>
        <select id="gender">
            <option value="male">👨 Мужчина</option>
            <option value="female">👩 Женщина</option>
        </select>
    </div>

    <div class="form-group">
        <label>Вес (кг):</label>
        <input type="number" id="weight" placeholder="Например: 75">
    </div>

    <div class="form-group">
        <label>Рост (см):</label>
        <input type="number" id="height" placeholder="Например: 175">
    </div>

    <div class="form-group">
        <label>Возраст:</label>
        <input type="number" id="age" placeholder="Например: 25">
    </div>

    <button id="sendData">Рассчитать в боте</button>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        document.getElementById('sendData').addEventListener('click', () => {
            const gender = document.getElementById('gender').value;
            const weight = document.getElementById('weight').value;
            const height = document.getElementById('height').value;
            const age = document.getElementById('age').value;

            if (!weight || !height || !age) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }

            // Формируем объект с данными
            const data = {
                gender: gender,
                weight: parseInt(weight),
                height: parseInt(height),
                age: parseInt(age)
            };

            // Отправляем данные обратно в бот в виде строки
            tg.sendData(JSON.stringify(data));
            tg.close(); // Закрываем мини-апп
        });
    </script>
</body>
</html>
