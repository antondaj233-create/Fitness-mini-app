<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bytwise Premium</title>
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-color: #f6f7fb;
            --surface-color: #ffffff;
            --text-main: #131313;
            --text-muted: #8e8e93;
            --primary-purple: #7f3dff;
            --accent-orange: #ff9500;
            --shadow-light: 0 8px 24px rgba(127, 61, 255, 0.06);
            --border-radius: 20px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 90px 0;
            box-sizing: border-box;
            -webkit-user-select: none;
        }

        .header {
            padding: 20px 20px 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-info h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
        }
        .user-info h1 span {
            background: #7f3dff;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            vertical-align: middle;
            margin-left: 6px;
        }
        .user-info p {
            margin: 4px 0 0 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .calories-widget {
            background: var(--surface-color);
            margin: 10px 20px;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-light);
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .progress-ring-container {
            position: relative;
            width: 110px;
            height: 110px;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .progress-text .percentage {
            font-size: 22px;
            font-weight: 800;
            display: block;
        }
        .progress-text .label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .calories-info-block {
            flex: 1;
        }
        .info-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .info-value {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .info-value span {
            color: var(--primary-purple);
        }
        .macros-grid {
            display: flex;
            gap: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .macro-item span {
            display: block;
            font-size: 14px;
            font-weight: 700;
        }
        .macro-b { color: #2ecc71; }
        .macro-zh { color: #f1c40f; }
        .macro-u { color: #3498db; }

        .section-title {
            margin: 20px 20px 12px 20px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .date-badge {
            font-size: 13px;
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 12px;
            color: #555;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .meals-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 0 20px;
        }
        .meal-card {
            background: var(--surface-color);
            padding: 12px 8px;
            border-radius: 16px;
            text-align: center;
            box-shadow: var(--shadow-light);
        }
        .meal-icon {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .meal-name {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .meal-cal {
            font-size: 14px;
            font-weight: 700;
        }

        .banner-ai {
            background: linear-gradient(135deg, #f3ecff 0%, #f9f6ff 100%);
            margin: 20px 20px;
            padding: 16px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(127, 61, 255, 0.12);
            cursor: pointer;
        }
        .banner-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .banner-icon {
            background: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-purple);
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(127, 61, 255, 0.1);
        }
        .banner-text h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
        }
        .banner-text p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .streak-card {
            background: var(--surface-color);
            margin: 0 20px 20px 20px;
            padding: 16px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-light);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .streak-fire {
            font-size: 32px;
            background: #f1ecf6;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .streak-info h4 {
            margin: 0;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .streak-info .days {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-purple);
            margin: 2px 0;
        }
        .streak-info p {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .empty-history {
            background: var(--surface-color);
            margin: 0 20px;
            padding: 30px 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-light);
            text-align: center;
        }
        .empty-icon {
            font-size: 36px;
            color: #d1d1d6;
            margin-bottom: 12px;
        }
        .empty-history h3 {
            margin: 0 0 6px 0;
            font-size: 16px;
        }
        .empty-history p {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .btn-add-text {
            background: var(--primary-purple);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(127, 61, 255, 0.25);
        }

        .tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: var(--surface-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #f0f0f2;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tabbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            width: 60px;
        }
        .tabbar-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .tabbar-item.active {
            color: var(--primary-purple);
        }
        
        .tabbar-item.center-btn {
            position: relative;
            top: -15px;
            width: 56px;
            height: 56px;
            background: var(--primary-purple);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(127, 61, 255, 0.35);
        }
        .tabbar-item.center-btn i {
            font-size: 22px;
            margin: 0;
        }

        .page {
            display: none;
            animation: pageIn 0.25s ease-out;
        }
        .page.active {
            display: block;
        }
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="page-home" class="page active">
        <div class="header">
            <div class="user-info">
                <h1 id="username-display">Привет, Атлет! <span>PRO</span></h1>
